# JAM is a manual, not a package. This file exists to configure the tools that
# standards/python.md requires, so the repository holds itself to the standard
# it publishes.

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["^templates/"]

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true
